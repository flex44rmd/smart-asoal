<title>Smart Asoul</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
 font-family:Arial,sans-serif; color:#f3c76b;
 background:
 radial-gradient(circle at 50% 10%, rgba(212,160,63,.20), transparent 35%),
 linear-gradient(135deg,#000 0%,#090909 45%,#1a1205 100%);
}
.card{
 width:min(430px,90%); text-align:center; padding:28px 24px 30px;
 border:1px solid rgba(212,160,63,.45); border-radius:26px;
 background:rgba(0,0,0,.78); box-shadow:0 0 45px rgba(212,160,63,.18);
}
.logo{
 width:190px; height:190px; object-fit:contain; border-radius:20px;
 margin:0 auto 8px; display:block;
}
h1{margin:4px 0 5px;font-size:29px;letter-spacing:1px}
.sub{color:#d7b875;opacity:.9;margin-bottom:25px}
a{
 display:block; text-decoration:none; color:#111;
 background:linear-gradient(135deg,#f4cf7b,#c9912f);
 margin:13px 0; padding:16px; border-radius:14px;
 font-weight:bold; font-size:16px;
 box-shadow:0 5px 16px rgba(0,0,0,.35); transition:.2s;
}
a:hover{transform:translateY(-2px);filter:brightness(1.08)}
.footer{font-size:12px;color:#a9894d;margin-top:20px}
</style>
